<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bifröst</title>
<!-- Écran de lancement : Rust y écrit l'étape par setStep(texte, progression 0..1 ou null, erreur). -->
<style>
  :root{--night:#0F1A2B;--night-2:#1C2B44;--ink:#E8EDF4;--mut:#9FB0C6;--err:#F08080;
    --rainbow:linear-gradient(90deg,#C94E6B,#D99A3E,#C9C04A,#52A77A,#3E8ED0,#7B6BD6)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--night);color:var(--ink);overflow:hidden;
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;cursor:default}
  main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 28px 40px}
  .drag{position:fixed;inset:0 0 auto 0;height:40px}
  .close{position:fixed;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--mut);
    display:grid;place-items:center;cursor:pointer}
  .close:hover{background:var(--night-2);color:var(--ink)}
  .logo{width:104px;height:104px;border-radius:24px;box-shadow:0 18px 40px -16px rgba(0,0,0,.7);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.045)}}
  h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
  #text{margin:0;min-height:42px;max-width:280px;text-align:center;color:var(--mut);font-size:13px}
  .err #text{color:var(--err)}
  .err .logo{animation:none;filter:grayscale(.6)}
  .bar{width:220px;height:6px;border-radius:999px;background:var(--night-2);overflow:hidden;position:relative}
  #fill{height:100%;width:0;background:var(--rainbow);border-radius:999px;transition:width .25s ease-out}
  /* Sans progression connue : un segment arc-en-ciel qui traverse. */
  .indet #fill{position:absolute;width:38%;animation:slide 1.3s ease-in-out infinite}
  @keyframes slide{from{left:-40%}to{left:100%}}
  .err .bar{visibility:hidden}
  .ver{position:fixed;bottom:12px;font-size:11px;color:#5E6F86;font-family:ui-monospace,Menlo,monospace}
  @media (prefers-reduced-motion:reduce){.logo,.indet #fill{animation:none}.indet #fill{left:31%}}
</style>
</head>
<body class="indet">
<div class="drag" data-tauri-drag-region></div>
<button class="close" type="button" aria-label="Fermer" id="close">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<main>
  <img class="logo" src="logo.svg" alt="">
  <h1>Bifröst</h1>
  <div class="bar" role="progressbar" aria-label="Progression" id="bar"><div id="fill"></div></div>
  <p id="text" role="status" aria-live="polite">Démarrage…</p>
</main>
<script>
  // Pas d'attribut onclick : la CSP de Tauri (hachages des scripts) les bloque.
  document.getElementById('close').addEventListener('click', () => window.__TAURI__?.window.getCurrentWindow().close());
  function setStep(text, progress, error){
    document.getElementById('text').textContent = text;
    const b = document.body, bar = document.getElementById('bar');
    b.classList.toggle('err', !!error);
    b.classList.toggle('indet', progress === null);
    if (progress === null) { bar.removeAttribute('aria-valuenow'); document.getElementById('fill').style.width = ''; }
    else { const pct = Math.round(progress * 100); bar.setAttribute('aria-valuenow', pct); document.getElementById('fill').style.width = pct + '%'; }
  }
</script>
</body>
</html>
