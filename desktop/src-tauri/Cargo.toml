[package]
name = "bifrost-desktop"
version = "0.0.0"
description = "Bifröst : l'application de bureau (écran de mise à jour, fenêtre, barre des tâches) autour du serveur Go"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-shell = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
