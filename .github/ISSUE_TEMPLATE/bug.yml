name: Bug
description: Quelque chose ne marche pas
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Version de Bifröst, description: "Affichée dans l'en-tête de la page ou par `bifrost --version`", placeholder: v0.1.4 }
    validations: { required: true }
  - type: dropdown
    id: context
    attributes:
      label: Contexte
      multiple: true
      options: [Binaire macOS, Binaire Linux, Binaire Windows, Docker, Source « ce poste », Source « seedbox SSH », qBittorrent, rTorrent / ruTorrent, Transmission, Deluge]
  - type: textarea
    id: steps
    attributes: { label: Étapes pour reproduire, description: "Sans jeton, sans clé, sans chemin ni hôte personnel." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Attendu / obtenu }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Sortie du terminal ou message affiché, render: text }
