# Tag vX.Y.Z → binaires signés sur la release GitHub + image ghcr.io.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with: { go-version: stable, check-latest: true }  # dernier correctif du Go courant : govulncheck exige les patches stdlib
      - run: make test
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Signature ed25519 de checksums.txt : c'est elle que le binaire vérifie
      # avant de se remplacer (update.go). La clé privée ne quitte pas ce job.
      - name: Signer checksums.txt
        env:
          BIFROST_SIGNING_KEY: ${{ secrets.BIFROST_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          go run -tags noagents . agent sign dist/checksums.txt
          gh release upload "${GITHUB_REF_NAME}" dist/checksums.txt.sig --clobber
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Propriétaire en minuscules, jamais en dur (le compte a déjà été renommé une fois).
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ steps.owner.outputs.lc }}/bifrost
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  # Application de bureau : installeurs + latest.json (mise à jour signée) ajoutés à la
  # release que `binaries` vient de créer. Exige le secret TAURI_SIGNING_PRIVATE_KEY.
  desktop:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, triple: aarch64-apple-darwin, goos: darwin, goarch: arm64 }
          - { os: macos-latest, triple: x86_64-apple-darwin, goos: darwin, goarch: amd64 }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc, goos: windows, goarch: amd64, exe: .exe }
          - { os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu, goos: linux, goarch: amd64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable, check-latest: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.triple }}" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Comme `make desktop-sidecar`, sans make (absent des runners Windows).
      - name: Serveur Go en sidecar (agents Linux embarqués)
        shell: bash
        run: |
          set -euo pipefail
          L="-s -w -X main.Version=${GITHUB_REF_NAME}"
          mkdir -p desktop/src-tauri/binaries  # ignoré par git : absent du checkout
          for a in amd64 arm64; do GOOS=linux GOARCH=$a CGO_ENABLED=0 go build -tags noagents -ldflags "$L" -o agent/bifrost-linux-$a .; done
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags "$L" -o "desktop/src-tauri/binaries/bifrost-${{ matrix.triple }}${{ matrix.exe }}" .
          # La version du tag, par un fichier : tauri-action découpe `args` et en ôte les guillemets.
          printf '{"version":"%s"}' "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/version.json"
      - run: npm ci
        working-directory: desktop
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          args: --target ${{ matrix.triple }} --config ${{ runner.temp }}/version.json
  # Les installeurs de bureau, signés avec la clé ed25519 des binaires : c'est ce que
  # vérifie un binaire seul avant d'installer l'application à sa place (desktop.go).
  desktop-checksums:
    needs: desktop
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: stable, check-latest: true }
      - name: Signer desktop-checksums.txt
        env:
          BIFROST_SIGNING_KEY: ${{ secrets.BIFROST_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir d && cd d
          gh release download "${GITHUB_REF_NAME}" -p '*-setup.exe' -p '*.app.tar.gz'
          sha256sum * > ../desktop-checksums.txt
          cd ..
          go run -tags noagents . agent sign desktop-checksums.txt
          gh release upload "${GITHUB_REF_NAME}" desktop-checksums.txt desktop-checksums.txt.sig --clobber

